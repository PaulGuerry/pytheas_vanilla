<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PytheasDB</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="top">
    <a href="./" class="brand"><img src="data/PYTHEAS_Logo.svg" alt="PytheasDB" class="logo"></a>
    <nav class="lang">
      <button type="button" class="lang-btn" data-lang="en">EN</button><span>|</span><button type="button" class="lang-btn" data-lang="fr">FR</button>
    </nav>
  </header>

  <main>
    <section class="bar">
      <div class="input-wrap">
        <input id="query" type="text" autocomplete="off" spellcheck="false" aria-label="Query">
        <ul id="dropdown" class="dropdown" hidden></ul>
      </div>
      <div id="pills" class="pills" aria-live="polite"></div>
      <div class="examples"><span id="examples-label"></span> <span id="chips"></span></div>
      <p id="status" class="muted"></p>
    </section>
    <div id="error-slot"></div>
    <section id="cards"></section>
  </main>

  <footer class="foot">
    <p id="release" class="muted"></p>
    <p>
      <strong id="f-contact"></strong> <a href="mailto:contact.pytheasdb@gmail.com">contact.pytheasdb@gmail.com</a> ·
      <strong id="f-cite"></strong> <a href="https://pubmed.ncbi.nlm.nih.gov/39628627/" target="_blank" rel="noopener">Percheron, Guerry &amp; Fabre (2024)</a> ·
      <strong id="f-sponsors"></strong> <a href="https://mirumpharma.com/" target="_blank" rel="noopener">Mirum</a>,
      <a href="https://www.ipsen.com/" target="_blank" rel="noopener">Ipsen</a>
    </p>
  </footer>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>

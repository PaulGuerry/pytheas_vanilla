<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PytheasDB Assistant</title>
  
  <!-- Font Awesome & Plotly -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  
  <style>
    :root {
      --bg-color: #0b131b;
      --card-bg: #14212d;
      --card-border: #233547;
      --accent-gold: #ffc107;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --user-msg-bg: #1e2d3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Minimalist Top Bar (Logo Only) */
    header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent-gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 18px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: var(--accent-gold);
    }

    /* Main Chat Container */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-bottom: 40px;
    }

    /* Welcome Banner */
    .welcome-screen {
      text-align: center;
      margin: 40px 0 20px 0;
    }

    .welcome-screen h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .welcome-screen h1 span {
      color: var(--accent-gold);
    }

    .welcome-screen p {
      color: var(--text-muted);
      font-size: 16px;
    }

    /* Chat Messages */
    .message {
      display: flex;
      gap: 16px;
      width: 100%;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .avatar.assistant {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--accent-gold);
    }

    .avatar.user {
      background-color: var(--accent-gold);
      color: #000;
      font-weight: bold;
    }

    .message-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      max-width: 100%;
      width: 100%;
    }

    .message.user .message-content {
      background: var(--user-msg-bg);
      width: auto;
      max-width: 80%;
      border-color: transparent;
    }

    /* Embedded Component Styles inside Response */
    .chart-box {
      width: 100%;
      height: 400px;
      margin-top: 15px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 13px;
    }

    .data-table th, .data-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
    }

    .data-table th {
      color: var(--accent-gold);
      font-weight: 600;
    }

    .data-table tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* Prompt Suggestions */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .chip {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      transform: translateY(-1px);
    }

    /* Floating Dialog Input Area */
    .input-container {
      padding: 20px;
      display: flex;
      justify-content: center;
      background: linear-gradient(180deg, rgba(11,19,27,0) 0%, var(--bg-color) 40%);
    }

    .input-box {
      width: 100%;
      max-width: 860px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 8px 16px 8px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s ease;
    }

    .input-box:focus-within {
      border-color: var(--accent-gold);
    }

    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 15px;
      padding: 8px 0;
    }

    .input-box input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .send-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header>
    <a href="#" class="logo-container">
      <div class="logo-icon"><i class="fa-solid fa-database"></i></div>
      <div class="logo-text">Pytheas<span>DB</span></div>
    </a>
  </header>

  <!-- Interactive Chat Stream -->
  <main id="main-stream">
    <div class="chat-wrapper" id="chat-wrapper">
      
      <div class="welcome-screen" id="welcome-screen">
        <h1>Explore <span>PytheasDB</span> Intelligence</h1>
        <p>Ask questions or query dataset visualisations using natural language.</p>
        
        <div class="suggestions">
          <div class="chip" onclick="submitQuery('compare sex-ratio between PFIC1 and PFIC2')">
            <i class="fa-solid fa-chart-bar"></i> "compare sex-ratio between PFIC1 and PFIC2"
          </div>
          <div class="chip" onclick="submitQuery('compare survival between all PFIC diseases')">
            <i class="fa-solid fa-chart-line"></i> "compare survival between all PFIC diseases"
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Input Dock -->
  <div class="input-container">
    <form class="input-box" id="query-form" onsubmit="handleFormSubmit(event)">
      <input type="text" id="user-input" placeholder="Ask PytheasDB to plot or compare data..." autocomplete="off">
      <button type="submit" class="send-btn"><i class="fa-solid fa-arrow-up"></i></button>
    </form>
  </div>

  <script>
    let chartCounter = 0;

    function handleFormSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('user-input');
      const query = input.value.trim();
      if (!query) return;

      submitQuery(query);
      input.value = '';
    }

    function submitQuery(queryText) {
      // Hide welcome screen on first query
      const welcomeScreen = document.getElementById('welcome-screen');
      if (welcomeScreen) welcomeScreen.style.display = 'none';

      const chatWrapper = document.getElementById('chat-wrapper');

      // 1. Render User Message
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerHTML = `
        <div class="message-content">${queryText}</div>
        <div class="avatar user"><i class="fa-solid fa-user"></i></div>
      `;
      chatWrapper.appendChild(userMsg);

      // 2. Process Intent & Query JSON Data
      const lowerQuery = queryText.toLowerCase();

      if (lowerQuery.includes('sex-ratio') || lowerQuery.includes('sex ratio')) {
        renderSexRatioResponse(chatWrapper, queryText);
      } else if (lowerQuery.includes('survival')) {
        renderSurvivalResponse(chatWrapper);
      } else {
        renderGenericResponse(chatWrapper, "I can fetch and display comparative statistics from the database. Try asking to compare sex ratios or survival curves between diseases.");
      }

      // Scroll to bottom
      document.getElementById('main-stream').scrollTop = document.getElementById('main-stream').scrollHeight;
    }

    // Dynamic Sex Ratio Handler (Fetches hp_disease_stats.json)
    function renderSexRatioResponse(container, queryText) {
      chartCounter++;
      const chartId = `plotly-chart-${chartCounter}`;

      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'message assistant';
      assistantMsg.innerHTML = `
        <div class="avatar assistant"><i class="fa-solid fa-robot"></i></div>
        <div class="message-content">
          <p>Here is the sex-ratio comparison derived from <code>hp_disease_stats.json</code>:</p>
          <div id="${chartId}" class="chart-box"></div>
          <table class="data-table">
            <thead>
              <tr><th>DISEASE</th><th>GENE</th><th>PATIENTS</th><th>SEX RATIO</th></tr>
            </thead>
            <tbody id="${chartId}-table"></tbody>
          </table>
        </div>
      `;
      container.appendChild(assistantMsg);

      // Fetch JSON and render Plotly chart
      fetch('data/hp_disease_stats.json')
        .then(res => res.json())
        .then(data => {
          // Filter if specific diseases mentioned
          let filtered = data;
          if (queryText.toLowerCase().includes('pfic1') && queryText.toLowerCase().includes('pfic2')) {
            filtered = data.filter(d => ['PFIC1', 'PFIC2'].includes((d.disease || d.name || '').toUpperCase()));
          }

          // Populate Table
          const tableBody = document.getElementById(`${chartId}-table`);
          filtered.forEach(row => {
            const tr = document.createElement('tr');
            const ratio = row.sexRatio ?? row.ratio ?? (row.boys && row.girls ? (row.boys / row.girls) : 0);
            tr.innerHTML = `
              <td>${row.disease || row.name || '-'}</td>
              <td>${row.gene || '-'}</td>
              <td>${row.patients?.total || row.patients || '-'}</td>
              <td>${typeof ratio === 'number' ? ratio.toFixed(2) : '-'}</td>
            `;
            tableBody.appendChild(tr);
          });

          // Populate Plotly Dark Bar Chart
          const xVals = filtered.map(d => d.disease || d.name);
          const yVals = filtered.map(d => d.sexRatio ?? d.ratio ?? (d.boys && d.girls ? d.boys / d.girls : 0));

          const trace = {
            x: xVals,
            y: yVals,
            type: 'bar',
            marker: { color: '#ffc107', cornerstyle: 'rounded' }
          };

          const layout = {
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: '#f0f4f8' },
            margin: { t: 20, b: 40, l: 40, r: 20 },
            xaxis: { gridcolor: '#233547' },
            yaxis: { gridcolor: '#233547', title: 'Sex Ratio (M/F)' }
          };

          Plotly.newPlot(chartId, [trace], layout, { responsive: true, displayModeBar: false });
        })
        .catch(err => {
          console.error("Failed to load JSON data:", err);
        });
    }

    // Dynamic Survival Kaplan-Meier Placeholder Response
    function renderSurvivalResponse(container) {
      chartCounter++;
      const chartId = `plotly-chart-${chartCounter}`;

      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'message assistant';
      assistantMsg.innerHTML = `
        <div class="avatar assistant"><i class="fa-solid fa-robot"></i></div>
        <div class="message-content">
          <p>Displaying overall survival estimates across all cataloged PFIC diseases:</p>
          <div id="${chartId}" class="chart-box"></div>
        </div>
      `;
      container.appendChild(assistantMsg);

      const trace1 = { x: [0, 2, 5, 10, 15], y: [1.0, 0.92, 0.85, 0.78, 0.70], mode: 'lines', name: 'PFIC1', line: { color: '#ffc107', shape: 'hv' } };
      const trace2 = { x: [0, 2, 5, 10, 15], y: [1.0, 0.88, 0.79, 0.65, 0.55], mode: 'lines', name: 'PFIC2', line: { color: '#17a2b8', shape: 'hv' } };

      const layout = {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: { color: '#f0f4f8' },
        margin: { t: 20, b: 40, l: 40, r: 20 },
        xaxis: { gridcolor: '#233547', title: 'Years' },
        yaxis: { gridcolor: '#233547', title: 'Survival Probability' }
      };

      Plotly.newPlot(chartId, [trace1, trace2], layout, { responsive: true, displayModeBar: false });
    }

    function renderGenericResponse(container, text) {
      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'message assistant';
      assistantMsg.innerHTML = `
        <div class="avatar assistant"><i class="fa-solid fa-robot"></i></div>
        <div class="message-content"><p>${text}</p></div>
      `;
      container.appendChild(assistantMsg);
    }
  </script>
</body>
</html>
